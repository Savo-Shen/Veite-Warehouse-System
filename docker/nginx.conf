# 边缘限流：即使应用层限流被绕过，登录和验证码接口在这里也有一道闸。
# 这两个 zone 定义在 http 块内（conf.d/*.conf 本身就被 include 在 http 里）。
limit_req_zone $binary_remote_addr zone=wms_login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=wms_api:10m rate=600r/m;

# 不回显 nginx 版本号
server_tokens off;

server {
    listen 80;
    server_name _;

    # ↓↓↓ 配好证书后打开这三行，把 HTTP 全量跳到 HTTPS ↓↓↓
    # location / { return 301 https://$host$request_uri; }
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 520m;

    # 安全响应头，与 vite.config.js 的 preview.headers 保持一致
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # 隐藏文件一律不发（.env、.git 等）
    location ~ /\. {
        deny all;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 登录、验证码、注册：爆破的入口，单独限流
    location ~ ^/prod-api/(login|register|captchaImage|captchaSms|smsLogin|emailLogin)$ {
        limit_req zone=wms_login burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://wms-backend:8080/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
    }

    # actuator 不对外，监控请走内网直连后端
    location /prod-api/actuator {
        deny all;
    }

    location /prod-api/ {
        limit_req zone=wms_api burst=200 nodelay;
        limit_req_status 429;

        proxy_pass http://wms-backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
    }
}

